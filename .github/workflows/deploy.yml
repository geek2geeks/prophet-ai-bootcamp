name: AI Actuary Bootcamp CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "ai-actuary-bootcamp/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Firebase production after quality checks"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  WORKDIR: ai-actuary-bootcamp
  NODE_VERSION: "20"
  FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ai-actuary-bootcamp-dev-260308' }}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'placeholder-api-key' }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'placeholder.firebaseapp.com' }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ai-actuary-bootcamp-dev-260308' }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'placeholder.firebasestorage.app' }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}

jobs:
  quality:
    name: Lint, typecheck, build and test
    runs-on: [self-hosted, Windows, X64, prophet-ai-bootcamp]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ai-actuary-bootcamp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-actuary-bootcamp/package-lock.json

      - name: Validate lockfile exists
        run: |
          if (-not (Test-Path -LiteralPath "package-lock.json")) {
            Write-Error "package-lock.json is missing."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Run Playwright smoke tests against static export
        run: |
          $serve = Join-Path $PWD "node_modules\.bin\serve.cmd"
          $server = Start-Process -FilePath $serve -ArgumentList @("out", "-p", "4173", "--no-clipboard", "--no-port-switching") -RedirectStandardOutput "serve.log" -RedirectStandardError "serve.err.log" -PassThru
          $exitCode = 1
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173/" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Seconds 2
            }
            if ($ready) {
              $env:PLAYWRIGHT_BASE_URL = "http://127.0.0.1:4173"
              npm run test:e2e:ci
              $exitCode = $LASTEXITCODE
            } else {
              Write-Host "Static server did not start in time."
              Get-Content "serve.log" -ErrorAction SilentlyContinue
              Get-Content "serve.err.log" -ErrorAction SilentlyContinue
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              taskkill /T /F /PID $server.Id 2>$null | Out-Null
            }
          }
          exit $exitCode

      - name: Upload static export
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ai-actuary-bootcamp-static-export
          path: ai-actuary-bootcamp/out
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ai-actuary-bootcamp-playwright-report
          path: |
            ai-actuary-bootcamp/playwright-report
            ai-actuary-bootcamp/test-results
            ai-actuary-bootcamp/serve.log
            ai-actuary-bootcamp/serve.err.log
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Firebase live (manual)
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, prophet-ai-bootcamp]
    timeout-minutes: 20
    environment:
      name: production
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download static export
        uses: actions/download-artifact@v8
        with:
          name: ai-actuary-bootcamp-static-export
          path: ai-actuary-bootcamp/out

      - name: Validate Firebase deploy configuration
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_ACTUARY_BOOTCAMP_DEV_260308 }}
        run: |
          if ($env:NEXT_PUBLIC_FIREBASE_API_KEY -eq "placeholder-api-key") {
            Write-Error "Missing GitHub Variables for Firebase public config."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT_JSON)) {
            Write-Error "Missing FIREBASE_SERVICE_ACCOUNT_AI_ACTUARY_BOOTCAMP_DEV_260308 secret."
            exit 1
          }

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_ACTUARY_BOOTCAMP_DEV_260308 }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13

      - name: Deploy Firebase Hosting and Firestore config
        working-directory: ai-actuary-bootcamp
        run: firebase deploy --project $env:FIREBASE_PROJECT_ID --only hosting,firestore:rules,firestore:indexes --non-interactive
